[build]
  command = "npm run build"
  # Required for Netlify OpenNext / Next.js Runtime (do not use out/ or publish static HTML)
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"
  # Temporary Cloudflare tunnel to the agent API. Replace with Render URL when live
  # (example: https://komero-api.onrender.com/api/v1).
  NEXT_PUBLIC_API_URL = "https://wiki-passes-foods-salaries.trycloudflare.com/api/v1"
  NEXT_PUBLIC_WHATSAPP_URL = "https://wa.me/?text=Hello%20Komero%2C%20I%20want%20to%20create%20my%20shop"

# Pin the Next.js Runtime so Netlify does not treat the site as a static export of out/
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/"
  to = "/en"
  status = 302
  force = false

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
